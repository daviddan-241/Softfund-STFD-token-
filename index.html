<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phantom Watch SOL Payment</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Phantom Watch SOL Payment</h1>

<div class="card">
  <h3>Payment Details</h3>

  <label>Amount (SOL):</label>
  <input type="number" id="amount" step="0.01" value="0.1">

  <label>Memo (optional):</label>
  <input type="text" id="memo" placeholder="Payment description">

  <p>Payable SOL Address: <strong id="recipientAddress"></strong></p>

  <button id="generateBtn">Generate Payment</button>
</div>

<div class="card" id="qrCard" style="display:none">
  <h3>Pay Now</h3>
  <div id="qr"></div>
  <button id="copyBtn">Copy Payment Link</button>
  <p id="status" class="muted">Scan QR with Phantom Watch Wallet or use the link to pay.</p>
</div>

<div class="card">
  <h3>Payment History</h3>
  <table id="paymentHistory">
    <thead>
      <tr>
        <th>Amount (SOL)</th>
        <th>Memo</th>
        <th>Timestamp</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.78.0/lib/index.iife.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
